name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. Added 2026-08-26 after a GitHub Actions outage
  # (a database failover) meant three pushes produced no run at all -
  # not a failure, no run. Without a dispatch there is no way to test
  # the commits it skipped except by pushing something else, and
  # re-running the old run only re-tests the old commit.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v5/v6 run on Node 24. v4/v5 target Node 20, which GitHub has
      # deprecated and now force-runs on 24 anyway, with a warning on
      # every job. Pinning the current majors removes the warning and
      # the forced-runtime surprise.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q
